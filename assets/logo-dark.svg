<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="sig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#aab6c2"/>
    </linearGradient>
  </defs>

  <!-- signal that stays below, then breaches the red line -->
  <path d="M40 150 L110 150 L150 96 L190 150 L250 150 L285 150 L320 44 L355 150 L430 150 L470 116 L510 150 L680 150"
        fill="none" stroke="url(#sig)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- the red line (threshold) -->
  <line x1="24" y1="150" x2="696" y2="150" stroke="#ff2e46" stroke-width="4"/>
  <circle cx="320" cy="150" r="7" fill="#ff2e46"/>
  <circle cx="320" cy="44" r="6" fill="#ff2e46"/>
  <line x1="320" y1="50" x2="320" y2="144" stroke="#ff2e46" stroke-width="2" stroke-dasharray="4 5" opacity="0.75"/>

  <!-- wordmark -->
  <text x="360" y="228" text-anchor="middle" font-size="52" font-weight="700" letter-spacing="6" fill="#e6edf3">
    RED<tspan fill="#ff2e46">LINE</tspan>BENCH
  </text>
  <text x="360" y="262" text-anchor="middle" font-size="19" font-weight="400" letter-spacing="9" fill="#8b98a5">
    refusal &#215; capability
  </text>
</svg>
